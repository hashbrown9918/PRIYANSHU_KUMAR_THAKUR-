<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML Snippet</title>
    <style>
        .card {
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
            transition: 0.3s;
            width: 300px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            margin: 20px auto;
            overflow: hidden;
        }
        .card:hover {
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
        }
        .container {
            padding: 2px 16px 16px 16px;
        }
        .btn {
            background-color: #04AA6D;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #059862;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="container">
            <h4><b>John Doe</b></h4> 
            <p>Architect & Engineer</p> 
            <a href="#" class="btn">Connect</a>
        </div>
    </div>

</body>
</html>
